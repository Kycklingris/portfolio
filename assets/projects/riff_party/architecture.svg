<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-labelledby="title desc">
  <title id="title">Riff Party deployment architecture</title>
  <desc id="desc">Players' phones and the host game connect through Cloudflare to the lobby and signaling server on a Hetzner VPS, which reaches Redis privately over Tailscale. Game traffic goes peer-to-peer over WebRTC, falling back to CoTURN relays on Oracle Cloud. Servers send traces and logs to Grafana Cloud.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6570"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #33383d; }
      .title { font-size: 15px; font-weight: 600; }
      .sub { font-size: 12px; fill: #5b6570; }
      .label { font-size: 12px; fill: #5b6570; }
      .box { fill: #f6f8fa; stroke: #8a949e; stroke-width: 1.5; }
      .cf { fill: #fff4e8; stroke: #e8892b; stroke-width: 1.5; }
      .group { fill: none; stroke: #b5bdc5; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .line { stroke: #5b6570; stroke-width: 1.5; fill: none; }
      .dashed { stroke-dasharray: 6 4; }
      .private { stroke: #2b8a3e; stroke-width: 2; }
      .private-label { font-size: 12px; fill: #2b8a3e; font-weight: 600; }
    </style>
  </defs>

  <!-- Clients -->
  <rect class="box" x="20" y="20" width="210" height="56" rx="8"/>
  <text class="title" x="125" y="44" text-anchor="middle">Players' phones</text>
  <text class="sub" x="125" y="63" text-anchor="middle">Browser · TypeScript + Lit</text>

  <rect class="box" x="530" y="20" width="210" height="56" rx="8"/>
  <text class="title" x="635" y="44" text-anchor="middle">Host game</text>
  <text class="sub" x="635" y="63" text-anchor="middle">Godot 4 + C++ module</text>

  <!-- Peer-to-peer game traffic -->
  <line class="line dashed" x1="232" y1="48" x2="528" y2="48" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="40" text-anchor="middle">WebRTC game data, peer-to-peer</text>

  <!-- Cloudflare -->
  <rect class="cf" x="255" y="150" width="250" height="56" rx="8"/>
  <text class="title" x="380" y="174" text-anchor="middle">Cloudflare</text>
  <text class="sub" x="380" y="193" text-anchor="middle">DNS · TLS · rate limiting</text>

  <line class="line" x1="125" y1="78" x2="300" y2="148" marker-end="url(#arrow)"/>
  <line class="line" x1="635" y1="78" x2="460" y2="148" marker-end="url(#arrow)"/>
  <text class="label" x="380" y="118" text-anchor="middle">Lobby + signaling (HTTPS / WebSocket)</text>

  <!-- Hetzner VPS -->
  <rect class="group" x="200" y="248" width="360" height="124" rx="10"/>
  <text class="sub" x="214" y="268">Hetzner VPS</text>

  <line class="line" x1="380" y1="208" x2="305" y2="282" marker-end="url(#arrow)"/>

  <rect class="box" x="220" y="284" width="170" height="64" rx="8"/>
  <text class="title" x="305" y="311" text-anchor="middle">Lobby + signaling</text>
  <text class="sub" x="305" y="330" text-anchor="middle">Rust · Axum · Docker</text>

  <rect class="box" x="450" y="284" width="95" height="64" rx="8"/>
  <text class="title" x="497" y="311" text-anchor="middle">Redis</text>
  <text class="sub" x="497" y="330" text-anchor="middle">loopback only</text>

  <line class="line private" x1="392" y1="316" x2="447" y2="316" marker-end="url(#arrow)"/>
  <text class="private-label" x="420" y="364" text-anchor="middle">Tailscale (private network)</text>

  <!-- CoTURN -->
  <rect class="box" x="590" y="284" width="150" height="64" rx="8"/>
  <text class="title" x="665" y="311" text-anchor="middle">CoTURN × 2</text>
  <text class="sub" x="665" y="330" text-anchor="middle">Oracle Cloud</text>

  <line class="line dashed" x1="690" y1="78" x2="690" y2="282" marker-end="url(#arrow)"/>
  <text class="label" x="680" y="180" text-anchor="end">TURN relay</text>
  <text class="label" x="680" y="196" text-anchor="end">when P2P fails</text>

  <!-- Observability -->
  <rect class="box" x="255" y="410" width="250" height="48" rx="8"/>
  <text class="title" x="380" y="439" text-anchor="middle">Grafana Cloud · traces &amp; logs</text>
  <line class="line" x1="380" y1="374" x2="380" y2="408" marker-end="url(#arrow)"/>
  <text class="label" x="390" y="395">OpenTelemetry</text>
</svg>
